[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forksync"
version = "0.1.0"
description = "Audit and fast-forward your GitHub forks without conflicts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Dan Alec Yamaguchi" }]
keywords = ["github", "fork", "sync", "gh", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
forksync = "forksync.cli:main"

[project.urls]
Homepage = "https://github.com/danalec/forksync"
Source = "https://github.com/danalec/forksync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# An explicit list, so the lint outcome does not change when ruff changes its
# defaults. CI installs the newest ruff; without this the build would break on
# a release that adds a rule.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
