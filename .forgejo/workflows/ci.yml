---
name: CI

# The GitHub-side workflow (.github/workflows/ci.yml) asks for ubuntu-24.04,
# windows-2022 and macos-15, because that is what GitHub's runners are
# called. This instance has one act_runner, labelled ubuntu-latest, so every
# one of those jobs sat at "Waiting to run" forever — the same thing happens
# to rgx on this instance.
#
# The runner's image is node:20-bookworm, and actions/setup-python@v5 cannot
# find a build for it: "The version '3.12' with architecture 'x64' was not
# found for this operating system". The image does carry Python 3.11, but
# Debian strips ensurepip's bundled wheels, so it has no pip either. This
# workflow therefore uses the image's own Python and installs pip for it.
#
# The GitHub workflow is skipped on this host by its server_url guard, so the
# two do not both run.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  # Debian marks its python as externally managed (PEP 668). The container is
  # disposable, so installing into it is fine; this is what lets pip do it.
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1 || ! python3 -m pip --version >/dev/null 2>&1; then
            echo "::notice::the runner image has no usable pip; installing python3-pip"
            apt-get update -qq
            apt-get install -y -qq python3 python3-pip
          fi
          echo "runner python: $(python3 --version 2>&1)"
          python3 -m pip --version
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install .

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build
        run: python3 -m pip wheel . --no-deps -w dist

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ruff
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1 || ! python3 -m pip --version >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq python3 python3-pip
          fi
          python3 -m pip install --upgrade pip
          python3 -m pip install ruff

      - name: Lint
        run: python3 -m ruff check src tests
